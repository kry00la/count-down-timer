<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synced Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0b0b0b;
      --cream:  #f0e8d0;
      --yellow: #f5c518;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Archivo', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      flex-shrink: 0;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid currentColor;
    }

    .role-badge.detecting  { color: #444; }
    .role-badge.controller { color: #4ade80; }
    .role-badge.display    { color: var(--yellow); }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.15} }

    /* ── Main time area ── */
    .time-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 0 16px;
    }

    .time-display {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .time-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-digits {
      font-family: 'Archivo Black', system-ui, sans-serif;
      color: var(--cream);
      line-height: 0.88;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      transition: color 0.35s;
    }

    .time-display[data-groups="2"] .time-digits { font-size: clamp(72px, 27vw, 420px); }
    .time-display[data-groups="3"] .time-digits { font-size: clamp(48px, 17.5vw, 280px); }

    .time-digits.warning { color: #f59e0b; }
    .time-digits.danger  { color: #ef4444; }

    .time-label {
      font-size: clamp(9px, 1.15vw, 18px);
      letter-spacing: 0.07em;
      font-weight: 500;
      color: var(--cream);
      opacity: 0.65;
      margin-top: clamp(4px, 0.9vw, 14px);
    }

    .time-sep {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 3vw, 48px);
      margin: 0 clamp(4px, 1.1vw, 20px);
      padding-bottom: clamp(14px, 2.8vw, 44px);
    }

    .time-display[data-groups="3"] .time-sep {
      gap: clamp(6px, 1.9vw, 30px);
      margin: 0 clamp(3px, 0.75vw, 12px);
      padding-bottom: clamp(9px, 1.9vw, 30px);
    }

    .sep-dot {
      border-radius: 50%;
      background: var(--cream);
      flex-shrink: 0;
      width: clamp(7px, 1.35vw, 21px);
      height: clamp(7px, 1.35vw, 21px);
    }

    .time-display[data-groups="3"] .sep-dot {
      width: clamp(5px, 0.88vw, 14px);
      height: clamp(5px, 0.88vw, 14px);
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 16px 28px 34px;
      flex-shrink: 0;
    }

    .bottom-left  { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .bottom-right { display: flex; flex-direction: column; gap: 10px; align-items: center; }

    /* Pill button — filled */
    .btn-pill {
      background: var(--yellow);
      color: #0b0b0b;
      border: none;
      border-radius: 40px;
      padding: 13px 34px;
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-pill:hover  { background: #fdd835; }
    .btn-pill:active { transform: scale(0.95); }
    .btn-pill:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* Pill button — outline */
    .btn-outline {
      background: transparent;
      color: var(--yellow);
      border: 2px solid var(--yellow);
      border-radius: 40px;
      padding: 11px 28px;
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-outline:hover  { background: rgba(245,197,24,0.10); }
    .btn-outline:active { transform: scale(0.95); }

    /* Circle button */
    .btn-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--yellow);
      color: #0b0b0b;
      border: none;
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-circle:hover  { background: #fdd835; }
    .btn-circle:active { transform: scale(0.93); }
    .btn-circle:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Set-time panel (slides up) ── */
    .sp-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s;
      z-index: 90;
    }

    .sp-backdrop.open { opacity: 1; pointer-events: auto; }

    .set-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #111;
      border-top: 1px solid #222;
      padding: 28px 40px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 100;
    }

    .set-panel.open { transform: translateY(0); }

    .sp-title {
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #4a4a4a;
      font-weight: 600;
    }

    .sp-inputs {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sp-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .sp-group label {
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #444;
    }

    .sp-group input {
      width: 84px;
      text-align: center;
      background: #0b0b0b;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: var(--cream);
      font-family: 'Archivo Black', system-ui, sans-serif;
      font-size: 2.2rem;
      padding: 10px 4px;
      outline: none;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }

    .sp-group input::-webkit-outer-spin-button,
    .sp-group input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .sp-group input:focus { border-color: var(--yellow); }

    .sp-colon {
      font-size: 2.2rem;
      font-weight: 700;
      color: #2e2e2e;
      padding-bottom: 22px;
    }

    .sp-actions { display: flex; gap: 12px; }

    /* ── Finish flash ── */
    .finish-flash {
      position: fixed;
      inset: 0;
      background: var(--yellow);
      opacity: 0;
      pointer-events: none;
      z-index: 200;
    }

    .finish-flash.animate {
      animation: bigflash 0.9s ease-out forwards;
    }

    @keyframes bigflash {
      0%   { opacity: 0.6; }
      100% { opacity: 0; }
    }

    /* ── Display mode ── */
    body.display-mode .controller-only { display: none !important; }
    body:not(.display-mode) .display-only { display: none !important; }

    /* Take Control: hidden until hover */
    #btn-take-control {
      opacity: 0;
      transition: opacity 0.2s;
    }

    body.display-mode:hover #btn-take-control {
      opacity: 1;
    }

    /* ── Mute button ── */
    #btn-mute {
      background: none;
      border: 1px solid #2a2a2a;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #555;
      padding: 0;
      transition: border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    #btn-mute:hover { border-color: #444; color: #888; }
    #btn-mute.muted { border-color: #ef4444; color: #ef4444; }

    /* ── Background video ── */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      display: none;
    }

    #bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
      display: none;
    }

    body.has-video #bg-video,
    body.has-video #bg-overlay { display: block; }

    /* ── Video picker row ── */
    .sp-video-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .sp-video-label {
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #444;
      white-space: nowrap;
    }

    .btn-video-pick {
      background: transparent;
      color: var(--cream);
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 7px 16px;
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .btn-video-pick:hover { border-color: #555; color: #fff; }

    #video-filename {
      font-size: 0.78rem;
      color: #555;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #video-filename.loaded { color: #4ade80; }

    .btn-video-clear {
      background: none;
      border: none;
      color: #444;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 2px;
      transition: color 0.2s;
      display: none;
    }

    .btn-video-clear:hover { color: #ef4444; }
    .btn-video-clear.visible { display: block; }
  </style>
</head>
<body>
  <video id="bg-video" autoplay muted loop playsinline></video>
  <div id="bg-overlay"></div>
  <div class="finish-flash" id="finish-flash"></div>
  <div class="sp-backdrop" id="sp-backdrop"></div>
  <input type="file" id="video-file-input" accept="video/*" style="display:none">

  <!-- Top bar -->
  <div class="top-bar">
    <span class="role-badge detecting" id="role-badge">
      <span class="sync-dot"></span>Detecting
    </span>
  </div>

  <!-- Time -->
  <div class="time-area">
    <div class="time-display" id="time-display" data-groups="2"></div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="bottom-left">
      <button class="btn-outline controller-only" id="btn-set">Set Time</button>
      <button class="btn-pill  controller-only" id="btn-start">Start</button>
      <button class="btn-pill  controller-only" id="btn-pause" style="display:none">Pause</button>
      <button class="btn-outline controller-only" id="btn-reset" style="display:none">Reset</button>
      <button class="btn-circle display-only" id="btn-take-control" title="Take Control">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </button>
    </div>
    <div class="bottom-right controller-only">
      <button class="btn-circle" id="btn-plus"  title="+ 1 minute">+</button>
      <button class="btn-circle" id="btn-minus" title="− 1 minute">−</button>
    </div>
  </div>

  <!-- Set-time panel -->
  <div class="set-panel" id="set-panel">
    <div class="sp-title">Set Time</div>
    <div class="sp-inputs">
      <div class="sp-group">
        <label for="inp-h">Hours</label>
        <input id="inp-h" type="number" min="0" max="99" value="0">
      </div>
      <div class="sp-colon">:</div>
      <div class="sp-group">
        <label for="inp-m">Minutes</label>
        <input id="inp-m" type="number" min="0" max="59" value="0">
      </div>
      <div class="sp-colon">:</div>
      <div class="sp-group">
        <label for="inp-s">Seconds</label>
        <input id="inp-s" type="number" min="0" max="59" value="5">
      </div>
    </div>
    <div class="sp-video-row">
      <span class="sp-video-label">Background</span>
      <button class="btn-video-pick" id="btn-video-pick">Choose Video</button>
      <span id="video-filename">No video</span>
      <button class="btn-video-clear" id="btn-video-clear" title="Remove video">&times;</button>
    </div>
    <div class="sp-actions">
      <button class="btn-pill"    id="btn-apply">Apply</button>
      <button class="btn-outline" id="btn-cancel">Cancel</button>
      <button id="btn-mute" title="Mute finish alarm">
        <svg id="icon-sound" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="icon-muted" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // ── Audio ─────────────────────────────────────────────────────────────────
    let audioCtx = null;
    let soundMuted = localStorage.getItem('synced-timer-muted') === 'true';

    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playTick() {
      if (soundMuted) return;
      const ctx  = getCtx();
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.08);
    }

    function playFinishAlarm() {
      if (soundMuted) return;
      const ctx = getCtx();
      // Three rising beeps
      const beeps = [
        { freq: 523, t: 0 },
        { freq: 659, t: 0.22 },
        { freq: 784, t: 0.44 },
      ];
      beeps.forEach(({ freq, t }) => {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + t);
        gain.gain.setValueAtTime(0, ctx.currentTime + t);
        gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + t + 0.01);
        gain.gain.setValueAtTime(0.5, ctx.currentTime + t + 0.15);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + t + 0.2);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.22);
      });
    }

    // ── Identity ──────────────────────────────────────────────────────────────
    const TAB_ID  = Math.random().toString(36).slice(2, 10);
    const channel = new BroadcastChannel('synced-timer-v1');

    // ── DOM ───────────────────────────────────────────────────────────────────
    const btnMute       = document.getElementById('btn-mute');
    const iconSound     = document.getElementById('icon-sound');
    const iconMuted     = document.getElementById('icon-muted');
    const timeDisplayEl = document.getElementById('time-display');
    const finishFlash   = document.getElementById('finish-flash');
    const btnStart      = document.getElementById('btn-start');
    const btnPause      = document.getElementById('btn-pause');
    const btnReset      = document.getElementById('btn-reset');
    const btnSet        = document.getElementById('btn-set');
    const btnApply      = document.getElementById('btn-apply');
    const btnCancel     = document.getElementById('btn-cancel');
    const btnTakeCtrl   = document.getElementById('btn-take-control');
    const btnPlus       = document.getElementById('btn-plus');
    const btnMinus      = document.getElementById('btn-minus');
    const inpH          = document.getElementById('inp-h');
    const inpM          = document.getElementById('inp-m');
    const inpS          = document.getElementById('inp-s');
    const setPanel      = document.getElementById('set-panel');
    const spBackdrop    = document.getElementById('sp-backdrop');
    const roleBadge     = document.getElementById('role-badge');

    // ── State ─────────────────────────────────────────────────────────────────
    const LS_STATE = 'synced-timer-state';

    let state = {
      totalSeconds: 0,
      remaining:    0,
      startedAt:    null,
      running:      false,
      finished:     false,
      inputH: 0, inputM: 0, inputS: 5,
    };

    let isController  = false;
    let roleDecided   = false;
    let tickInterval  = null;
    let lastHeartbeat = Date.now();
    let prevFinished  = false;
    let lastTickedSec = -1;

    // ── Helpers ───────────────────────────────────────────────────────────────
    const pad = n => String(n).padStart(2, '0');

    function computeRemaining() {
      if (!state.running || state.startedAt === null) return state.remaining;
      return Math.max(0, state.remaining - Math.floor((Date.now() - state.startedAt) / 1000));
    }

    function inputToSeconds() {
      return (Math.max(0, parseInt(inpH.value) || 0)) * 3600
           + (Math.max(0, Math.min(59, parseInt(inpM.value) || 0))) * 60
           + (Math.max(0, Math.min(59, parseInt(inpS.value) || 0)));
    }

    // ── Render time ───────────────────────────────────────────────────────────
    function renderTimeDisplay(secs) {
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;

      const colorClass = state.finished ? 'danger'
                       : secs > 0 && secs <= 10  ? 'danger'
                       : secs > 10 && secs <= 30 ? 'warning' : '';

      const dot   = `<div class="sep-dot"></div>`;
      const colon = `<div class="time-sep">${dot}${dot}</div>`;
      const group = (val, lbl) => `
        <div class="time-group">
          <div class="time-digits ${colorClass}">${pad(val)}</div>
          <div class="time-label">${lbl}</div>
        </div>`;

      if (h > 0) {
        timeDisplayEl.dataset.groups = '3';
        timeDisplayEl.innerHTML = group(h,'Hours') + colon + group(m,'Minutes') + colon + group(s,'Seconds');
      } else {
        timeDisplayEl.dataset.groups = '2';
        timeDisplayEl.innerHTML = group(m,'Minutes') + colon + group(s,'Seconds');
      }
    }

    // ── Render buttons ────────────────────────────────────────────────────────
    function renderButtons() {
      if (!isController) return;
      const rem    = computeRemaining();
      const active = state.running || (!state.finished && rem > 0);

      btnSet.style.display   = active ? 'none' : '';
      btnStart.style.display = active ? 'none' : '';
      btnPause.style.display = active ? '' : 'none';
      btnReset.style.display = active ? '' : 'none';
      btnPause.textContent   = state.running ? 'Pause' : 'Resume';
    }

    function triggerFinish() {
      finishFlash.classList.remove('animate');
      void finishFlash.offsetWidth;
      finishFlash.classList.add('animate');
      playFinishAlarm();
    }

    function applyMuteUI() {
      btnMute.classList.toggle('muted', soundMuted);
      iconSound.style.display = soundMuted ? 'none' : '';
      iconMuted.style.display = soundMuted ? '' : 'none';
      btnMute.title = soundMuted ? 'Unmute finish alarm' : 'Mute finish alarm';
    }

    btnMute.addEventListener('click', () => {
      soundMuted = !soundMuted;
      localStorage.setItem('synced-timer-muted', soundMuted);
      applyMuteUI();
    });

    applyMuteUI();

    // ── Background video ──────────────────────────────────────────────────────
    const bgVideo        = document.getElementById('bg-video');
    const videoFileInput = document.getElementById('video-file-input');
    const btnVideoPick   = document.getElementById('btn-video-pick');
    const btnVideoClear  = document.getElementById('btn-video-clear');
    const videoFilename  = document.getElementById('video-filename');

    let videoBlobUrl = null;

    // IndexedDB — stores the raw video File so other tabs can load it
    const IDB_NAME  = 'synced-timer-db';
    const IDB_STORE = 'video';
    const IDB_KEY   = 'bg';

    function openIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
        req.onsuccess  = e => resolve(e.target.result);
        req.onerror    = e => reject(e.target.error);
      });
    }

    async function saveFileToIDB(file) {
      const db = await openIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(file, IDB_KEY);
        tx.oncomplete = resolve;
        tx.onerror    = e => reject(e.target.error);
      });
    }

    async function loadFileFromIDB() {
      const db = await openIDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
        req.onsuccess = e => resolve(e.target.result || null);
        req.onerror   = e => reject(e.target.error);
      });
    }

    async function clearFileFromIDB() {
      const db = await openIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(IDB_KEY);
        tx.oncomplete = resolve;
        tx.onerror    = e => reject(e.target.error);
      });
    }

    function applyVideoFile(file) {
      if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
      videoBlobUrl = URL.createObjectURL(file);
      bgVideo.src  = videoBlobUrl;
      bgVideo.play();
      document.body.classList.add('has-video');
      videoFilename.textContent = file.name;
      videoFilename.classList.add('loaded');
      btnVideoClear.classList.add('visible');
    }

    async function setVideoSource(file) {
      applyVideoFile(file);
      await saveFileToIDB(file);
      broadcast({ type: 'VIDEO_UPDATE' });
    }

    async function clearVideo() {
      if (videoBlobUrl) { URL.revokeObjectURL(videoBlobUrl); videoBlobUrl = null; }
      bgVideo.src = '';
      document.body.classList.remove('has-video');
      videoFilename.textContent = 'No video';
      videoFilename.classList.remove('loaded');
      btnVideoClear.classList.remove('visible');
      videoFileInput.value = '';
      await clearFileFromIDB();
      broadcast({ type: 'VIDEO_CLEAR' });
    }

    async function syncVideoFromIDB() {
      const file = await loadFileFromIDB();
      if (file) applyVideoFile(file);
    }

    btnVideoPick.addEventListener('click', () => videoFileInput.click());
    videoFileInput.addEventListener('change', () => {
      if (videoFileInput.files[0]) setVideoSource(videoFileInput.files[0]);
    });
    btnVideoClear.addEventListener('click', clearVideo);

    // Load video on startup (in case it was set in a previous session or other tab)
    syncVideoFromIDB();

    // ── Full render ───────────────────────────────────────────────────────────
    function renderUI() {
      const rem = computeRemaining();
      renderTimeDisplay(rem);
      if (state.finished && !prevFinished) triggerFinish();
      prevFinished = state.finished;

      // Tick on each new second in the last 10
      if (state.running && rem > 0 && rem <= 10 && rem !== lastTickedSec) {
        lastTickedSec = rem;
        playTick();
      }
      if (!state.running) lastTickedSec = -1;

      renderButtons();
    }

    // ── localStorage ──────────────────────────────────────────────────────────
    function saveState() {
      localStorage.setItem(LS_STATE, JSON.stringify(state));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(LS_STATE));
        if (saved) state = { ...state, ...saved };
      } catch (_) {}
    }

    // ── BroadcastChannel ──────────────────────────────────────────────────────
    function broadcast(msg) {
      channel.postMessage({ ...msg, from: TAB_ID });
    }

    channel.onmessage = ({ data }) => {
      if (data.from === TAB_ID) return;
      switch (data.type) {
        case 'PING':
          if (isController) broadcast({ type: 'PONG' });
          break;
        case 'PONG':
          if (!roleDecided) assignRole('display');
          break;
        case 'HEARTBEAT':
          lastHeartbeat = Date.now();
          break;
        case 'STATE_UPDATE':
          if (!isController) {
            state = data.state;
            saveState();
            renderUI();
          }
          break;
        case 'VIDEO_UPDATE':
          if (!isController) syncVideoFromIDB();
          break;
        case 'VIDEO_CLEAR':
          if (!isController) {
            if (videoBlobUrl) { URL.revokeObjectURL(videoBlobUrl); videoBlobUrl = null; }
            bgVideo.src = '';
            document.body.classList.remove('has-video');
          }
          break;
        case 'CLAIM_CONTROL':
          if (isController) {
            stopLoop();
            isController = false;
            applyDisplayUI();
            startDisplayLoop();
          }
          break;
      }
    };

    // ── Role assignment ───────────────────────────────────────────────────────
    function assignRole(role) {
      if (roleDecided) return;
      roleDecided = true;
      if (role === 'controller') becomeController();
      else becomeDisplay();
    }

    function applyControllerUI() {
      document.body.classList.remove('display-mode');
      roleBadge.className = 'role-badge controller';
      roleBadge.innerHTML = '<span class="sync-dot"></span>Controller';
    }

    function applyDisplayUI() {
      document.body.classList.add('display-mode');
      roleBadge.className = 'role-badge display';
      roleBadge.innerHTML = '<span class="sync-dot"></span>Live';
    }

    function becomeController() {
      isController = true;
      applyControllerUI();
      inpH.value = state.inputH;
      inpM.value = state.inputM;
      inpS.value = state.inputS;
      startControllerLoop();
      renderUI();
    }

    function becomeDisplay() {
      isController = false;
      applyDisplayUI();
      startDisplayLoop();
      renderUI();
    }

    // ── Tick loops ────────────────────────────────────────────────────────────
    function stopLoop() {
      if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
    }

    function startControllerLoop() {
      stopLoop();
      tickInterval = setInterval(controllerTick, 500);
    }

    function startDisplayLoop() {
      stopLoop();
      tickInterval = setInterval(() => {
        renderUI();
        // Auto-promote if controller has gone silent
        if (Date.now() - lastHeartbeat > 5000) {
          broadcast({ type: 'PING' });
          setTimeout(() => {
            if (!isController) {
              broadcast({ type: 'CLAIM_CONTROL' });
              isController = true;
              roleDecided  = true;
              applyControllerUI();
              inpH.value = state.inputH;
              inpM.value = state.inputM;
              inpS.value = state.inputS;
              startControllerLoop();
              renderUI();
            }
          }, 400);
        }
      }, 200);
    }

    function controllerTick() {
      broadcast({ type: 'HEARTBEAT' });
      if (!state.running) return;
      const rem = computeRemaining();
      if (rem <= 0) {
        state.running   = false;
        state.remaining = 0;
        state.startedAt = null;
        state.finished  = true;
        saveState();
        broadcast({ type: 'STATE_UPDATE', state });
      }
      renderUI();
    }

    // ── +/- ───────────────────────────────────────────────────────────────────
    function adjustMinutes(delta) {
      if (state.running || (!state.finished && state.remaining > 0)) {
        // Adjust live timer
        const newRem = Math.max(0, computeRemaining() + delta * 60);
        state.remaining = newRem;
        state.startedAt = Date.now();
        saveState();
        broadcast({ type: 'STATE_UPDATE', state });
        renderUI();
      } else {
        // Adjust inputs
        const total = Math.max(0, inputToSeconds() + delta * 60);
        inpH.value = Math.floor(total / 3600);
        inpM.value = Math.floor((total % 3600) / 60);
        inpS.value = total % 60;
        renderTimeDisplay(total);
      }
    }

    btnPlus.addEventListener('click',  () => adjustMinutes(1));
    btnMinus.addEventListener('click', () => adjustMinutes(-1));

    // ── Set panel ─────────────────────────────────────────────────────────────
    function openSetPanel()  { setPanel.classList.add('open');    spBackdrop.classList.add('open'); }
    function closeSetPanel() { setPanel.classList.remove('open'); spBackdrop.classList.remove('open'); }

    btnSet.addEventListener('click',      openSetPanel);
    btnCancel.addEventListener('click',   closeSetPanel);
    spBackdrop.addEventListener('click',  closeSetPanel);

    btnApply.addEventListener('click', () => {
      state.inputH = parseInt(inpH.value) || 0;
      state.inputM = parseInt(inpM.value) || 0;
      state.inputS = parseInt(inpS.value) || 0;
      if (!state.running && state.remaining === 0) renderTimeDisplay(inputToSeconds());
      closeSetPanel();
    });

    // ── Main controls ─────────────────────────────────────────────────────────
    btnStart.addEventListener('click', () => {
      const total = inputToSeconds();
      if (total === 0) { openSetPanel(); return; }
      state.totalSeconds = total;
      state.remaining    = total;
      state.startedAt    = Date.now();
      state.running      = true;
      state.finished     = false;
      state.inputH       = parseInt(inpH.value) || 0;
      state.inputM       = parseInt(inpM.value) || 0;
      state.inputS       = parseInt(inpS.value) || 0;
      saveState();
      broadcast({ type: 'STATE_UPDATE', state });
      closeSetPanel();
      renderUI();
    });

    btnPause.addEventListener('click', () => {
      if (state.running) {
        state.remaining = computeRemaining();
        state.running   = false;
        state.startedAt = null;
      } else {
        state.startedAt = Date.now();
        state.running   = true;
      }
      saveState();
      broadcast({ type: 'STATE_UPDATE', state });
      renderUI();
    });

    btnReset.addEventListener('click', () => {
      state.running = false; state.remaining = 0;
      state.totalSeconds = 0; state.startedAt = null;
      state.finished = false;
      saveState();
      broadcast({ type: 'STATE_UPDATE', state });
      closeSetPanel();
      renderUI();
    });

    btnTakeCtrl.addEventListener('click', () => {
      broadcast({ type: 'CLAIM_CONTROL' });
      stopLoop();
      isController = true; roleDecided = true;
      applyControllerUI();
      inpH.value = state.inputH;
      inpM.value = state.inputM;
      inpS.value = state.inputS;
      startControllerLoop();
      renderUI();
    });

    inpM.addEventListener('blur', () => { inpM.value = Math.min(59, Math.max(0, parseInt(inpM.value)||0)); });
    inpS.addEventListener('blur', () => { inpS.value = Math.min(59, Math.max(0, parseInt(inpS.value)||0)); });

    document.addEventListener('keydown', e => {
      if (e.code !== 'Space') return;
      if (!isController) return;
      // Don't intercept spacebar while typing in inputs or the panel is open
      if (document.activeElement.tagName === 'INPUT') return;
      if (setPanel.classList.contains('open')) return;
      e.preventDefault();
      if (btnPause.style.display !== 'none') btnPause.click();
      else if (btnStart.style.display !== 'none') btnStart.click();
    });

    // ── Startup ───────────────────────────────────────────────────────────────
    loadState();
    prevFinished = state.finished;
    renderTimeDisplay(computeRemaining());

    broadcast({ type: 'PING' });
    setTimeout(() => assignRole('controller'), 400);
  </script>
</body>
</html>
